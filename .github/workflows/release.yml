name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing Changelog version to package without publishing
        required: true
        default: "0.1.0"
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release assets
    if: github.repository == 'GiZGY/MultiWechat'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Validate source and changelog
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          grep -Fq "## $VERSION" CHANGELOG.md
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi
      - name: Test
        run: swift test
      - name: Build release assets
        run: scripts/build-release.sh "${{ steps.version.outputs.value }}"
      - name: Store release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ github.run_id }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*-checksums.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download verified assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets-${{ github.run_id }}
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          assets=(
            "dist/MultiWechat-${version}.dmg"
            "dist/MultiWechat-${version}.zip"
            "dist/MultiWechat-${version}-checksums.txt"
          )
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "MultiWechat ${version}" \
              --generate-notes \
              --latest
          fi
