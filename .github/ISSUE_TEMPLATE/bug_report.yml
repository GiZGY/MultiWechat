name: Bug 报告
description: 报告可复现的功能或兼容性问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿上传账号数据、聊天数据库、二维码、容器目录或含个人信息的日志。
  - type: input
    id: multiwechat-version
    attributes:
      label: MultiWechat 版本
      placeholder: 例如 0.1.0
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS 与芯片
      placeholder: 例如 macOS 15.6 / Apple Silicon
    validations:
      required: true
  - type: input
    id: wechat-version
    attributes:
      label: 微信版本
      placeholder: 微信菜单栏中的完整版本号
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从一个干净、可理解的初始状态开始描述。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认内容不包含账号、聊天、二维码、密钥或其他个人信息。
          required: true
